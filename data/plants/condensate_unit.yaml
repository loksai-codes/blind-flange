# Illustrative condensate injection unit.
# The layout is a simplified teaching model inspired by published accounts of
# the Piper Alpha condensate pumps (1988). It is NOT an as-built drawing of any
# real plant, and tags other than PSV-504 are invented.
unit: Condensate injection (illustrative)
components:
  # suction
  - {tag: JT-DRUM,  kind: vessel,      name: JT flash drum (condensate),            state: in_service, pressure_source: true, service: condensate}
  - {tag: L-SH,     kind: line,        name: Condensate suction header,             state: in_service, service: condensate}
  # pump A train (shut down for maintenance)
  - {tag: SV-A,     kind: valve,       name: Pump A suction isolation valve,        state: closed,     normal: open, service: condensate}
  - {tag: STR-A,    kind: strainer,    name: Pump A suction strainer,               state: shutdown,   normal: in_service, service: condensate}
  - {tag: DR-A,     kind: valve,       name: Strainer A drain valve,                state: closed, service: condensate}
  - {tag: P-A,      kind: pump,        name: Condensate injection pump A,           state: shutdown,   normal: in_service, pressure_source: true, service: condensate}
  - {tag: L-PD-A,   kind: line,        name: Pump A discharge line,                 state: in_service, service: condensate}
  - {tag: RLV-504,  kind: valve,       name: PSV-504 inlet block valve,             state: open, service: condensate}
  - {tag: L-RL-504, kind: line,        name: Pump A relief line,                    state: in_service, service: condensate}
  - {tag: BF-504,   kind: blind,       name: Blind flange fitted in place of PSV-504, state: installed, normal: not_installed, integrity: temporary, service: condensate}
  - {tag: PSV-504,  kind: psv,         name: Pump A discharge relief valve,         state: removed,    normal: closed, service: condensate}
  - {tag: NRV-A,    kind: check_valve, name: Pump A discharge non-return valve,     state: open, service: condensate}
  - {tag: DV-A,     kind: valve,       name: Pump A discharge isolation valve,      state: closed,     normal: open, service: condensate}
  # pump B train (running)
  - {tag: SV-B,     kind: valve,       name: Pump B suction isolation valve,        state: open, service: condensate}
  - {tag: STR-B,    kind: strainer,    name: Pump B suction strainer,               state: in_service, service: condensate}
  - {tag: P-B,      kind: pump,        name: Condensate injection pump B,           state: in_service, pressure_source: true, service: condensate}
  - {tag: L-PD-B,   kind: line,        name: Pump B discharge line,                 state: in_service, service: condensate}
  - {tag: RLV-505,  kind: valve,       name: PSV-505 inlet block valve,             state: open, service: condensate}
  - {tag: L-RL-505, kind: line,        name: Pump B relief line,                    state: in_service, service: condensate}
  - {tag: PSV-505,  kind: psv,         name: Pump B discharge relief valve,         state: closed, service: condensate}
  - {tag: NRV-B,    kind: check_valve, name: Pump B discharge non-return valve,     state: open, service: condensate}
  - {tag: DV-B,     kind: valve,       name: Pump B discharge isolation valve,      state: open, service: condensate}
  # relief and drains
  - {tag: L-RH,     kind: line,        name: Relief header,                         state: in_service, service: flare}
  - {tag: FLARE-KO, kind: vessel,      name: Flare knock-out drum,                  state: in_service, service: flare}
  - {tag: DRAIN,    kind: vessel,      name: Closed drain drum,                     state: in_service, service: drain}
  # discharge and export
  - {tag: L-DH,     kind: line,        name: Condensate discharge header,           state: in_service, service: condensate}
  - {tag: EV-1,     kind: valve,       name: Cooler E-1 inlet isolation valve,      state: closed,     normal: open, service: condensate}
  - {tag: E-1,      kind: exchanger,   name: Export condensate cooler,              state: shutdown,   normal: in_service, service: condensate}
  - {tag: EV-2,     kind: valve,       name: Cooler E-1 outlet isolation valve,     state: closed,     normal: open, service: condensate}
  - {tag: BV-1,     kind: valve,       name: Cooler E-1 bypass valve,               state: open,       normal: closed, service: condensate}
  - {tag: L-EX,     kind: line,        name: Export line,                           state: in_service, service: condensate}
  - {tag: MOL-XV,   kind: valve,       name: Main oil line tie-in valve,            state: open, service: condensate}
  - {tag: MOL,      kind: header,      name: Main oil line,                         state: in_service, pressure_source: true, service: oil}
  # utilities
  - {tag: FW-HDR,   kind: header,      name: Flush water header,                    state: in_service, pressure_source: true, service: flush_water}
  - {tag: XV-9,     kind: valve,       name: Cooler E-1 flush water inlet valve,    state: closed, service: flush_water}
# Services a connection may cross on purpose, as [from, to]: pressure from the first
# service may legitimately enter the second. Used to decide which sources are worth
# listing; every connection still carries pressure either way.
tie_ins:
  - [condensate, oil]           # condensate is injected into the main oil line
  - [condensate, flare]         # relief to the flare header
  - [condensate, drain]         # drains to the closed drain drum
  - [flush_water, condensate]   # the flush-water connection on cooler E-1
connections:
  - [JT-DRUM, L-SH]
  - [L-SH, SV-A]
  - [SV-A, STR-A]
  - [STR-A, DR-A]
  - [DR-A, DRAIN]
  - [STR-A, P-A]
  - [P-A, L-PD-A]
  - [L-PD-A, RLV-504]
  - [RLV-504, L-RL-504]
  - [L-RL-504, BF-504]
  - [BF-504, PSV-504]
  - [PSV-504, L-RH]
  - [L-PD-A, NRV-A, forward]
  - [NRV-A, DV-A, forward]
  - [DV-A, L-DH]
  - [L-SH, SV-B]
  - [SV-B, STR-B]
  - [STR-B, P-B]
  - [P-B, L-PD-B]
  - [L-PD-B, RLV-505]
  - [RLV-505, L-RL-505]
  - [L-RL-505, PSV-505]
  - [PSV-505, L-RH]
  - [L-PD-B, NRV-B, forward]
  - [NRV-B, DV-B, forward]
  - [DV-B, L-DH]
  - [L-RH, FLARE-KO]
  - [L-DH, EV-1]
  - [EV-1, E-1]
  - [E-1, EV-2]
  - [EV-2, L-EX]
  - [L-DH, BV-1]
  - [BV-1, L-EX]
  - [L-EX, MOL-XV]
  - [MOL-XV, MOL]
  - [FW-HDR, XV-9]
  - [XV-9, E-1]

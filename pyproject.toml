[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blindflange"
version = "0.1.0"
description = "Permit-to-work conflict checks over a plant piping graph, on Relate."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["relate-db>=1.0.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blindflange = "blindflange.cli:main"

# queries/ and schema/ stay at the top of the repo so they can be read on
# their own, and ship inside the package as blindflange/queries and
# blindflange/schema.
[tool.setuptools]
packages = ["blindflange", "blindflange.queries", "blindflange.schema"]

[tool.setuptools.package-dir]
"blindflange" = "src/blindflange"
"blindflange.queries" = "queries"
"blindflange.schema" = "schema"

[tool.setuptools.package-data]
"blindflange.queries" = ["*.cypher"]
"blindflange.schema" = ["*.cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
